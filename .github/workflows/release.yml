name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      MYSQL_VERSION: 8.0.40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start MySQL
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\mysql.zip"
          Invoke-WebRequest "https://cdn.mysql.com/archives/mysql-8.0/mysql-$env:MYSQL_VERSION-winx64.zip" -OutFile $zip
          tar -xf $zip -C $env:RUNNER_TEMP
          $bin = "$env:RUNNER_TEMP\mysql-$env:MYSQL_VERSION-winx64\bin"
          $data = "$env:RUNNER_TEMP\mysql-data"
          & "$bin\mysqld.exe" --initialize-insecure "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process -FilePath "$bin\mysqld.exe" -ArgumentList "--datadir=$data", "--port=3310", "--bind-address=127.0.0.1", "--mysqlx=0" -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            & "$bin\mysqladmin.exe" -h 127.0.0.1 -P 3310 -u root ping 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 2
          }
          exit 1

      - name: Test
        env:
          FEEDERCOPY_TEST_MYSQL_HOST: 127.0.0.1
          FEEDERCOPY_TEST_MYSQL_PORT: 3310
          FEEDERCOPY_TEST_MYSQL_USER: root
        run: dotnet test tests/FeederCopy.Tests -c Release

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish app
        run: dotnet publish src/FeederCopy.App -c Release -r win-x64 --self-contained -p:Version=${{ steps.version.outputs.VERSION }} -o ./publish

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Package with Velopack
        run: vpk pack --packId FeederCopy --packVersion ${{ steps.version.outputs.VERSION }} --packDir ./publish --mainExe FeederCopy.exe --packTitle "Feeder Comparator" --icon src/FeederCopy.App/Resources/AppIcon/app.ico

      - name: Unpack portable build
        shell: pwsh
        run: Expand-Archive -Path Releases/FeederCopy-win-Portable.zip -DestinationPath installer/portable -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build folder-choice installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.VERSION }}" "/DSourceDir=${{ github.workspace }}\installer\portable" "/DOutputDir=${{ github.workspace }}\Releases\installer" installer\FeederCopy.iss'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Releases/installer/FeederCopy-Setup.exe
            Releases/FeederCopy-win-Portable.zip
            Releases/*.nupkg
            Releases/releases.win.json
            Releases/assets.win.json
            Releases/RELEASES
          generate_release_notes: true
