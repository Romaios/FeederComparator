name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: feedercopy-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfeedercopy-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        env:
          FEEDERCOPY_TEST_MYSQL_HOST: 127.0.0.1
          FEEDERCOPY_TEST_MYSQL_PORT: 3306
          FEEDERCOPY_TEST_MYSQL_USER: root
          FEEDERCOPY_TEST_MYSQL_PASSWORD: feedercopy-ci
        run: dotnet test tests/FeederCopy.Tests -c Release

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish app
        run: dotnet publish src/FeederCopy.App -c Release -r win-x64 --self-contained -p:Version=${{ steps.version.outputs.VERSION }} -o ./publish

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Package with Velopack
        run: vpk pack --packId FeederCopy --packVersion ${{ steps.version.outputs.VERSION }} --packDir ./publish --mainExe FeederCopy.exe --packTitle "Feeder kWh Copy" --icon src/FeederCopy.App/Resources/AppIcon/app.ico

      - name: Unpack portable build
        shell: pwsh
        run: Expand-Archive -Path Releases/FeederCopy-win-Portable.zip -DestinationPath installer/portable -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build folder-choice installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.VERSION }}" "/DSourceDir=${{ github.workspace }}\installer\portable" "/DOutputDir=${{ github.workspace }}\Releases\installer" installer\FeederCopy.iss'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Releases/installer/FeederCopy-Setup.exe
            Releases/FeederCopy-win-Portable.zip
            Releases/*.nupkg
            Releases/releases.win.json
            Releases/assets.win.json
            Releases/RELEASES
          generate_release_notes: true
